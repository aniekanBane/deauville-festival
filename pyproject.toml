[project]
name = "deauville-festival"
version = "0.1.0"
description = "Deauville Festivasl CSM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "scalar-fastapi>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[project.scripts]
deauville = "deauville_festival.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deauville_festival"]

[tool.mypy]
strict = true
exclude = ["\\.venv"]
plugins = ["pydantic.mypy",]

enable_error_code = [
    "ignore-without-code", 
    "explicit-override", 
    "redundant-self", 
    "possibly-undefined", 
    "truthy-bool",
]
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ["no-untyped-def"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py", "tests_*.py"]

[tool.ruff.lint]
select = [
    "E",        # pycodestyle errors
    "W",        # pycodestyle warnings
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "S",        # security (bandit)
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "FA",       # flake8-future-annotations
    "G",        # flake8-logging-format
    "SIM",      # flake8-simplify
    "PERF",     # perflint
    "UP",       # pyupgrades
]
ignore = [
    "E501",     # Line too long, handled by `black`
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
